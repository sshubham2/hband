{{template "page-start" .}}<main class="reader">
<h1>{{.Report.Title}}</h1>
<p class="meta"><a class="back" href="/reports/{{.Report.Slug}}">Back to the full report</a></p>
<section class="comments branch" id="comments">
<h2>Thread</h2>
{{range .Thread}}{{template "comment" .}}{{end}}</section>
</main>
{{template "page-end" .}}
