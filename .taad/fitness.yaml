# Architecture rules for this project: seams a design settled, in a form
# that fails. Checked on every slice by code-review and validate-slice.
#
# Add to this by hand freely -- the engine only ever APPENDS rules whose
# name it has not seen, so your comments and your edits survive.
rules:
  # settled by SL-001
  - name: no request header ever supplies scheme, host or client identity
    files: '**/*.go'
    must_not_match:
    - (?i)["`](x-forwarded-[a-z-]+|x-real-ip|forwarded)["`]
    because: 'Scheme and host come only from HBAND_BASE_URL. A trusted forwarded header elsewhere
      lets any client spoof the callback URL, the Secure decision or the trusted CSRF origin.
      SL-013 settled C-006: the client address for open counting is resolved in clientaddr.go
      alone, from X-Forwarded-For sent by a peer listed in HBAND_TRUSTED_PROXIES; the rule
      ''no Go file names a forwarded header other than X-Forwarded-For'' keeps that one file
      to that one header. Both quote styles are matched, so a raw string is no way round it.'
    except_files:
    - '**/*_test.go'
    - internal/server/clientaddr.go
  - name: no cookie is ever SameSite=Strict
    files: '**/*.go'
    must_not_match:
    - SameSiteStrictMode
    - (?i)samesite=strict
    because: The spike measured that Edge drops Strict state and session cookies on the GitHub
      Authorize-button path (a form POST answered with 303). A Strict cookie breaks sign-in
      for exactly the first-time user.
    except_files:
    - '**/*_test.go'
  - name: being the owner is never stored in the database
    files: internal/store/migrations/*.sql
    must_not_match:
    - (?i)(^|[(,])\s*"?(role|roles|is_owner|owner|is_admin|admin)"?\s+(INTEGER|INT|TEXT|BOOLEAN|BOOL|BLOB|NUMERIC|ANY)\b
    - (?i)ADD\s+COLUMN\s+"?(role|roles|is_owner|owner|is_admin|admin)"?\b
    because: The project constraint identifies the owner by the GitHub ID pinned in config.
      A stored role is a second way to reach admin, which survives a pin change and can be written
      by any SQL bug.
  - name: an /admin route is only ever registered through the one gated mount
    files: '**/*.go'
    must_not_match:
    - \.Handle(Func)?\(\s*"(?:[A-Z]+\s+)?/admin(?!/?",\s*auth\.RequireOwner\()
    because: Admin handlers must be rows of adminRoutes, mounted once as mux.Handle("/admin/",
      auth.RequireOwner(adminMux)). A pattern registered any other way escapes the access-matrix
      test, and it may escape the gate.
    except_files:
    - '**/*_test.go'
  - name: templates never bypass html/template escaping
    files: internal/**/*.go
    must_not_match:
    - template\.(HTML|HTMLAttr|JS|JSStr|URL|CSS|Srcset)\(
    - '\bimport\s+(?:\.|[A-Za-z_]\w*)\s+"html/template"'
    - '\n[ \t]+(?:\.|[A-Za-z_]\w*)[ \t]+"html/template"'
    because: Q-001 forbids passing user text through template.HTML. The epic forbids report
      bytes ever appearing in site pages. A typed conversion is how both happen silently.
    except_files:
    - '**/*_test.go'
  - name: production code never links the fake GitHub
    files: '**/*.go'
    must_not_import:
    - github.com/sshubham2/hband/internal/testutil*
    because: The fake GitHub issues a session for whatever user ID it is told. Compiled into
      the binary, it is a sign-in-as-owner backdoor.
    except_files:
    - '**/*_test.go'
    - internal/testutil/**

  # settled by SL-001
  - name: every cookie is written by the one cookie helper
    files: '**/*.go'
    must_not_match:
    - http\.Cookie\s*\{
    - http\.SetCookie\(
    - (?i)Header\(\)\.(Set|Add)\("set-cookie"
    because: A browser silently ignores a __Host- cookie (deletions included) that lacks Secure
      or Path=/, and only in production. A cookie whose SameSite is left unset also escapes
      the Strict rule. One constructor makes the attribute set a property of the code (m1).
    except_files:
    - '**/*_test.go'
    - internal/auth/cookies.go
  - name: site HTML is never rendered through text/template
    files: '**/*.go'
    must_not_import:
    - text/template
    because: text/template escapes nothing. A page rendered through it puts comment text, titles
      or report-derived strings into site HTML unescaped. The existing template.HTML rule cannot
      see an import (m5).
    except_files:
    - '**/*_test.go'
  - name: no handler derives scheme or host from the request
    files: '**/*.go'
    must_not_match:
    - \b(r|req|request)\.Host\b
    - \b(r|req|request)\.TLS\b
    - \b(r|req|request)\.URL\.(Host|Scheme)\b
    - \b(r|req|request)\.Referer\(\)
    - '(?i)Header\.(Get|Values)\(\s*["`](host|origin|referer)["`]\s*\)'
    - '(?i)Header\[\s*["`](host|origin|referer)["`]\s*\]'
    because: Scheme and host come only from HBAND_BASE_URL. Behind the VPS proxy, the Host header
      and the TLS state are whatever the client or proxy sent, so an absolute URL, Secure decision
      or trusted origin built from them can be spoofed. The existing rule only lists forwarded-header
      names (m6).
    except_files:
    - '**/*_test.go'
    - internal/testutil/**
  - name: no redirect is written through http.Redirect
    files: '**/*.go'
    must_not_match:
    - \bhttp\.Redirect\(
    - \bhttp\.RedirectHandler\(
    - '(?i)\.(Set|Add)\(\s*["`]location["`]'
    - '(?i)\[\s*["`]location["`]\s*\]'
    - \bhttp\.Status(SeeOther|Found|MovedPermanently|TemporaryRedirect|PermanentRedirect)\b
    - \.WriteHeader\(\s*(30[0-3]|30[78])\s*\)
    because: http.Redirect runs path.Clean on a validated local target. That turns `/./` plus
      a backslash and `evil.example` into a Location that browsers follow off the site, an open
      redirect right after a genuine GitHub sign-in (M-add-1). Redirects go through auth.SeeOther,
      which writes the LocalPath-checked string verbatim.
    except_files:
    - '**/*_test.go'
    - internal/testutil/**
    - internal/auth/next.go
  - name: the identity provider's endpoints are read only by the config loader
    files: '**/*.go'
    must_not_match:
    - '"HBAND_[A-Z_]*(GITHUB|OAUTH)[A-Z_]*(URL|ENDPOINT|HOST|API)[A-Z_]*"'
    because: This replaces the retired rule 'the identity provider's endpoints cannot be set
      from the environment', which contradicted the person-approved finish line. The https-or-loopback
      guard and the startup override warning live in config.Load, so a second reader of HBAND_GITHUB_URL
      or HBAND_GITHUB_API_URL would point sign-in at an unvalidated identity provider. internal/testutil/**
      is excepted because the acceptance harness there (internal/testutil/program) writes these names
      into the environment of the program it starts; the rule that production code never imports
      internal/testutil keeps it out of the product binary, so it never reaches config.Load.
    except_files:
    - '**/*_test.go'
    - internal/config/config.go
    - internal/testutil/**

  - name: site HTML is never built as a Go string literal
    files: '**/*.go'
    must_not_match:
    - '["`]\s*<[a-zA-Z!/]'
    because: Site HTML comes only from template files under templates/, which html/template escapes
      for the place each value lands. A page assembled in a Go string literal puts logins, titles
      or comment text into markup unescaped (m5).
    except_files:
    - '**/*_test.go'
    - internal/testutil/**
    - tests/**
  - name: no sign-in control is ever a form
    files: internal/**/templates/**
    must_not_match:
    - '(?i)<form\b[^>]*\baction\s*=\s*["'']?[^"''\s>]*/auth/github/login'
    - '(?i)\bformaction\s*=\s*["'']?[^"''\s>]*/auth/github/login'
    because: Every sign-in control is an anchor to /auth/github/login. A form that submits there
      has its redirect to the identity provider blocked by the site's form-action 'self' policy
      in Chromium and Safari, so sign-in fails silently in the browser and no loop test can see
      it (m3).
  # settled by SL-003
  - name: report bytes are written only by serveRaw
    files: '**/*.go'
    must_not_match:
    - \bhttp\.Serve(Content|File|FileFS)\(
    - \bhttp\.(Dir|FileServer)\(
    - \bos\.DirFS\(
    because: 'serveRaw is the one place that replaces the site CSP with rawCSP (sandbox, script-src
      ''none'', frame-ancestors) and sets nosniff and CORP. A second ServeContent or ServeFile
      writes report bytes under the site policy: script-src ''self'', no sandbox, and the site''s
      own origin. Opened top-level, that page is unsandboxed same-origin HTML. A file server
      over a directory (http.FileServer(http.Dir(...)), http.FileServerFS(os.DirFS(...))) is
      the likeliest accidental way to do the same to <data>/reports. The static assets are served
      from the embedded filesystem, which none of these names.'
    except_files:
    - internal/server/raw.go
    - '**/*_test.go'
    - internal/testutil/**
  - name: no site template frames a report with scripts or the site origin, or inlines it
    files: internal/**
    must_not_match:
    - (?i)\bsrcdoc\s*=
    - (?i)\bsandbox\s*=\s*["']?[^"'>]*\ballow-(scripts|same-origin|top-navigation|forms)
    because: The project constraint requires the report iframe to be sandboxed without allow-scripts.
      Isolation is path-based on the site origin, so allow-same-origin hands the report the
      site's cookies and parent DOM, and allow-top-navigation or allow-forms lets it drive the
      reader's page. srcdoc puts report bytes inside a site page, which the constraint forbids.
      The glob covers every non-Go file under internal/ (templates and the embedded static
      files that are served under the site policy alike); Go files hold the report policy
      itself, which the HTTP tests pin.
    except_files:
    - '**/*.go'
    - '**/testdata/**'
  - name: only the audited templates contain a frame element
    files: internal/**
    must_not_match:
    - (?i)<(iframe|frame|fencedframe|object|embed)\b
    because: A frame, object or embed that loads a report without a sandbox attribute leaves only
      the report policy header between a reader and the report's scripts, and a regular expression
      cannot say 'an iframe lacking a sandbox attribute'. So the element is forbidden outside the
      two templates whose iframes are pinned by the HTTP tests (the reader page and the owner's
      preview). A page placed under static/ is served under the site policy, whose frame-src
      'self' allows framing /raw/<slug>, so the glob covers it too.
    except_files:
    - '**/*.go'
    - '**/testdata/**'
    - internal/server/templates/report.html
    - internal/server/templates/admin_report.html
  - name: only raw.go and admin.go open report files
    files: '**/*.go'
    must_not_match:
    - \.OpenRaw\b
    because: OpenRaw hands back the open file of a report, drafts included when its last argument
      is false. The token is forbidden outside the two handlers that are pinned by tests (the
      public one, whose publishedOnly argument TestHiddenReportsAreIndistinguishable pins, and
      the owner's preview), so a multi-line call, a method value or a flag held in a variable
      cannot slip past a pattern that tried to read the argument.
    except_files:
    - internal/server/raw.go
    - internal/server/admin.go
    - internal/reports/**
    - '**/*_test.go'
  - name: only the gated admin reaches drafts
    files: '**/*.go'
    must_not_match:
    - \.BySlug\b
    - \.ListAll\b
    because: BySlug and ListAll return drafts. A public handler that calls one serves an unpublished
      report or reveals that it exists, which defeats the identical 404s for draft, unpublished,
      deleted and unknown slugs. Only the owner-gated admin may see drafts. The token form
      also catches a method value and a call split over lines.
    except_files:
    - internal/server/admin.go
    - internal/reports/**
    - '**/*_test.go'

  # settled by SL-004
  - name: only the owner's admin page reads the dislike tally
    files: '**/*.go'
    must_not_match:
    - \.\s*OwnerTally\b
    because: 'OwnerTally is the only producer of a dislike count. A reader handler, template
      helper or new endpoint that calls it (or takes its method value) serves dislikes to readers,
      which the project''s privacy constraint forbids. Known hole: a dislike field added to
      PublicView inside internal/votes. TestDislikesDoNotInterfere catches that; this rule does
      not.'
    except_files:
    - internal/server/admin.go
    - internal/votes/**
    - '**/*_test.go'
  - name: only internal/votes writes SQL on the votes table
    files: '**/*.go'
    must_not_match:
    - \b(FROM|INTO|UPDATE|JOIN)\s+votes\b
    - \bUPDATE\s+OR\s+[A-Z]+\s+votes\b
    - '\bFROM\b[^"`;]*,\s*votes\b'
    because: 'A second reader of the table can count kind=''down'' and bypass both the OwnerTally
      fence and the PublicView type. A second writer bypasses Cast''s published-only check and
      its single-statement discipline. Known holes (CC-001): lower-case SQL; a table name built
      by concatenation; a quoted or schema-qualified name (FROM "votes", FROM main.votes); a
      comma join whose FROM sits in another string literal than the table name; and a view or
      trigger over votes created by a later .sql migration, which no Go-file glob can see.'
    except_files:
    - internal/votes/**
    - '**/*_test.go'
  - name: vote writes never open a transaction
    files: internal/votes/**/*.go
    must_not_match:
    - \.Begin(Tx)?\(
    - (?i)\b(BEGIN|SAVEPOINT)\b
    - \bsql\.Tx\b
    because: Spike concurrent-vote-upserts-no-busy measured a read-then-write transaction failing
      215-253 times per run with SQLITE_BUSY/BUSY_SNAPSHOT, returned at once without waiting
      on busy_timeout, and losing votes. Single statements had 0 errors under the same load.
      SAVEPOINT starts the same deferred transaction in autocommit mode, so it is named beside
      BEGIN. Known holes (CC-001) - a transaction opened OUTSIDE this package and handed in
      through an interface other than sql.Tx (for example a DBTX interface the caller satisfies
      with a transaction), a statement spelled by concatenation, and a Go identifier that
      merely contains the keyword.
    except_files:
    - '**/*_test.go'

  # settled by SL-006
  - name: only internal/comments writes SQL on the comments table
    files: '**/*.go'
    must_not_match:
    - \b(FROM|INTO|UPDATE|JOIN)\s+comments\b
    - \bUPDATE\s+OR\s+[A-Z]+\s+comments\b
    - \bFROM\b[^"`;]*,\s*comments\b
    because: 'The redaction of hidden rows (blanked inside Tree''s SELECT) and the same-report,
      visible-parent, published-report insert live only in internal/comments. A second reader
      can put removed text or a blocked writer''s login on a public page. A second writer can
      attach a reply across reports or under a hidden comment, or write parent_id out of id
      order and break arrange''s post-order. Known holes, as for the votes rule: lower-case
      SQL, a table name built by concatenation, quoted or schema-qualified names, and views
      or triggers created in a .sql migration.'
    except_files:
    - internal/comments/**
    - '**/*_test.go'
  - name: comment writes never open a transaction
    files: internal/comments/**/*.go
    must_not_match:
    - \.Begin(Tx)?\(
    - (?i)\b(BEGIN|SAVEPOINT)\b
    - \bsql\.Tx\b
    because: 'Spike concurrent-vote-upserts-no-busy (lesson #949) measured read-then-write transactions
      on this store pool failing 215-253 times per run with SQLITE_BUSY or BUSY_SNAPSHOT, returned
      at once without waiting on busy_timeout, while single statements failed 0 times. A failed
      comment post would reach a signed-in reader as a 503. Known hole: a transaction opened
      outside the package and handed in through an interface.'
    except_files:
    - '**/*_test.go'
  - name: the comment write handler resolves the poster with auth.Participant, never ViewerFrom
    files: internal/server/**/*.go
    must_not_match:
    - \bViewerFrom\s*\(
    because: 'ViewerFrom reports a store outage as an anonymous visitor. A write handler that
      resolved the poster that way would answer the signed-out 303 and the reader''s write (a
      comment now, a vote or a feedback message later) would be silently dropped behind a
      success-looking redirect. Participant turns the outage into a 503 (lesson #949; N-029
      waived this for votes without a rule). The rule covers every file of internal/server, so
      a handler that is renamed or moved is still caught. Reader pages (reader.go, which will
      also hold the branch page of SC-013) and the gated admin (admin.go) are the only files
      allowed to treat an outage as anonymous. Known gap: a helper placed in reader.go or
      admin.go, or in internal/auth, that wraps ViewerFrom and is called by a write handler
      passes this rule. TestCommentStoreFailure (a POST while the session lookup fails answers
      503 and stores nothing) is the behavioural guard for that, and the next write handler
      adds the same case.'
    except_files:
    - internal/server/reader.go
    - internal/server/admin.go
    - '**/*_test.go'

  # settled by SL-006
  - name: site scripts never build HTML from strings or reach the network
    files: internal/server/static/**
    must_not_match:
    - \.(innerHTML|outerHTML)\s*\+?=
    - \binsertAdjacentHTML\s*\(
    - \bdocument\.write(ln)?\s*\(
    - \beval\s*\(|\bnew\s+Function\s*\(
    - '\b(setHTML(Unsafe)?|parseHTML(Unsafe)?|createContextualFragment|parseFromString)\s*\(|\.srcdoc\s*=|\bsetAttribute\s*\(\s*[''"]srcdoc'
    - \bfetch\s*\(
    - \bXMLHttpRequest\b
    - \b(sendBeacon|WebSocket\w*|EventSource|WebTransport)\b
    because: 'Comment text and every login reach the page only through html/template''s contextual
      escaping (Q-001 forbids user text as HTML). A site script that parses a string into live
      markup (innerHTML and its siblings) reintroduces markup injection: a forged byline or a
      forged Author badge, which is the page''s only trust signal. siteCSP does not stop that,
      though it still blocks script execution: script-src ''self'' carries no unsafe-inline
      and no unsafe-eval. A script that makes a request of its own (fetch, XHR, a beacon, a
      WebSocket, an EventSource) would settle open question Q-012, site JavaScript talking to
      the server, by accident, so none may. The SC-013 toggle is DOM-only on purpose. Known
      gaps (bounded_by in the corpus): image and link-prefetch beacons, import(), Worker and
      serviceWorker.register, form.submit() and requestSubmit(), outerHTML reached through a
      variable or bracket access, and any DOM sink the list does not name. The glob also
      matches site.css, so the rule is live before thread.js exists.'

  # settled by SL-007
  - name: only internal/feedback names the feedback tables in SQL
    files: '**/*.go'
    must_not_match:
    - \b(FROM|INTO|UPDATE|JOIN)\s+feedback(_replies)?\b
    - \bUPDATE\s+OR\s+[A-Z]+\s+feedback(_replies)?\b
    - \bFROM\b[^"`;]*,\s*feedback(_replies)?\b
    because: 'A second reader of the feedback tables can put a private message, or the fact
      that one exists, on a page that is not the owner''s admin page or the sender''s own view.
      The comments code is the likeliest place for such a read to creep in. A second writer
      bypasses Send''s published-only check and its single-statement discipline. Known holes,
      as for the comments and votes rules: lower-case SQL, a table name built by concatenation,
      quoted or schema-qualified names, and views or triggers created in a .sql migration.'
    except_files:
    - internal/feedback/**
    - '**/*_test.go'
  - name: only the owner's admin page reads feedback with its senders or replies to it
    files: '**/*.go'
    must_not_match:
    - \.\s*Owner(Inbox|Reply)\w*\b
    because: 'OwnerInbox returns every message on a report with each sender''s login, and OwnerReply
      writes text that the sender alone will be shown. A reader handler, a template helper or
      a new endpoint that calls either one, or takes its method value, serves private feedback
      to readers or lets a non-owner answer as the author. Known hole: a method reached through
      an interface value, or a wrapper inside internal/feedback. TestFeedbackDoesNotInterfere
      catches those, and this rule does not.'
    except_files:
    - internal/server/admin.go
    - internal/feedback/**
    - '**/*_test.go'
  - name: only the reader page reads a sender's own feedback thread
    files: '**/*.go'
    must_not_match:
    - \.\s*SenderThreads\b
    because: 'SenderThreads returns one account''s private messages and the author''s replies,
      and it is safe only when keyed by the signed-in viewer''s own GitHub ID, which renderReader
      takes from the session. Any other caller can key it with a request value and show one
      reader''s thread to another. Quiet until SC-017 adds the method. Known hole: a call in
      reader.go keyed by something other than v.GitHubID. SC-017''s per-label noninterference
      test is the guard for that.'
    except_files:
    - internal/server/reader.go
    - internal/feedback/**
    - '**/*_test.go'
  - name: feedback writes never open a transaction
    files: internal/feedback/**/*.go
    must_not_match:
    - \.Begin(Tx)?\(
    - (?i)\b(BEGIN|SAVEPOINT)\b
    - \bsql\.Tx\b
    because: 'Spike concurrent-vote-upserts-no-busy (lesson #949) measured read-then-write transactions
      on this store pool failing 215-253 times per run with SQLITE_BUSY or BUSY_SNAPSHOT, returned
      at once without waiting on busy_timeout, while single statements failed 0 times. A failed
      feedback send reaches the reader as a 503 and the message is lost. Known hole: a transaction
      opened outside the package and handed in through an interface.'
    except_files:
    - '**/*_test.go'

  # settled by SL-010
  - name: removal never deletes a comment row
    files: internal/comments/**/*.go
    must_not_match:
    - (?i)\bDELETE\s+FROM\s+\S*comments\b
    - (?i)\bremoved_at\s*=\s*NULL\b
    because: 'Removal is the one UPDATE of removed_at. A DELETE of a removed leaf would make
      it ''vanish'' just as the prune does, but it would lose the row that the Blocked users page
      lists, and break the guarantee that unblocking never restores a removed comment. With
      replies, a DELETE fails with 787 (NO ACTION self-FK), which would surface as a 500. The
      existing schema tests that DELETE on purpose are _test.go files. The rule that only internal/comments
      writes the comments table already covers every file outside internal/comments; this one
      covers the inside. The second pattern guards the other way a removal could be undone, a
      write of NULL back into removed_at (the reads say IS NULL, which it leaves alone). Setting
      removed_at to 0 would not un-remove: visibleSQL tests IS NULL, so 0 still means removed.
      Known holes, named and not chased (this is a tripwire over spellings; the behavioural guard
      is TestRemove/blocked-writer-commutes and SC-021''s unblock test over a removed comment):
      a bound nil argument (removed_at = ?), CASE or NULLIF expressions, concatenated SQL, a
      quoted identifier ("removed_at" = NULL), the row-value form SET (removed_at) = (NULL),
      and REPLACE INTO or INSERT OR REPLACE INTO comments, which re-inserts the row with
      removed_at NULL.'
    except_files:
    - '**/*_test.go'
  - name: only internal/comments writes the blocked_accounts table
    files: '**/*.go'
    must_not_match:
    - (?i)\b(INTO|UPDATE(\s+OR\s+\w+)?|DELETE\s+FROM)\s+\S*blocked_accounts\b
    because: 'Block and Unblock in internal/comments are the only writers, and they sit inside
      the no-transaction fence. Block is where the pinned owner''s own id is refused: the book is
      built with that id (comments.New), so no caller has to remember the refusal, and a book
      built with no owner id refuses every block. A second writer in votes, feedback or server
      could block the author, hiding every Author comment on the site, or could write inside
      a transaction. votes and feedback only READ the table, in three shapes: a NOT EXISTS inside
      their own write statements (Cast, Withdraw, Send), the follow-up EXISTS read that picks the
      refusal after one of those wrote nothing, and the blocked column of the owner''s feedback
      inbox. This pattern leaves those reads alone.'
    except_files:
    - internal/comments/**
    - '**/*_test.go'

  # settled by SL-013
  - name: no Go file names a forwarded header other than X-Forwarded-For
    files: '**/*.go'
    must_not_match:
    - (?i)["`]x-forwarded-(?:[a-eg-z-][a-z-]*|f|f[a-np-z-][a-z-]*|fo|fo[a-qs-z-][a-z-]*|for[a-z-]+)["`]
    - (?i)["`](x-real-ip|x-forwarded|forwarded)["`]
    - (?i)["`][a-z0-9-]*(-ip|client-?ip|socket-?ip)(v[46])?["`]
    - (?i)["`](?:(?:[a-wyz0-9-][a-z0-9-]*|x[a-z0-9-]+)-)?forwarded(?:-[a-z-]+)?["`]
    because: 'clientaddr.go is excepted from the broad forwarded-header rule only so that it
      can read X-Forwarded-For. If it also named X-Forwarded-Proto or X-Forwarded-Host, a client
      could steer scheme or host again. If it named X-Real-IP or Forwarded, it would trust a
      header the rightmost-untrusted walk does not cover, and a client could choose its own
      identity. The last two patterns close the family of client-identity headers a CDN or
      an ingress adds (True-Client-IP, CF-Connecting-IP, X-Azure-ClientIP, Fly-Client-IP,
      X-Original-Forwarded-For): any quoted name ending in -ip or client-ip, and any quoted
      name made of forwarded, with or without a prefix other than the single letter x
      (X-Forwarded-For is x then forwarded, which is why that one prefix is left out). Known
      holes are a header name built by concatenation or held in a constant defined elsewhere,
      ranging over r.Header, and client-identity names that match none of those shapes (for
      example X-Envoy-External-Address). The bare X-Forwarded, and a name ending in -ip,
      client-ip or socket-ip with a trailing v4 or v6 (Cf-Pseudo-IPv4, CF-Connecting-IPv6), are
      matched too.'
    except_files:
    - '**/*_test.go'
  - name: only clientaddr.go reads the connecting address
    files: '**/*.go'
    must_not_match:
    - \.RemoteAddr\b
    because: Behind the VPS proxy, RemoteAddr is the proxy for every visitor. Any other code
      keying on it, such as a later per-address rate limit or another counter, collapses every
      visitor into one, which is R-004. Each such reader must go through the client resolver
      in clientaddr.go and its trusted-proxy walk.
    except_files:
    - internal/server/clientaddr.go
    - '**/*_test.go'
    - internal/testutil/**
  - name: open writes never open a transaction
    files: internal/opens/**/*.go
    must_not_match:
    - \.Begin(Tx)?\(
    - (?i)\b(BEGIN|SAVEPOINT)\b
    - \bsql\.Tx\b
    because: 'Spike concurrent-vote-upserts-no-busy (lesson #949) measured read-then-write transactions
      on this pool failing 215-253 times per run with SQLITE_BUSY or BUSY_SNAPSHOT, returned
      at once without waiting on busy_timeout. Single statements failed 0 times. Record runs
      on every public report GET, so a transaction there loses opens under load. Known hole:
      a transaction opened outside the package and handed in through an interface.'
    except_files:
    - '**/*_test.go'
  - name: only internal/opens names the report_opens table in SQL
    files: '**/*.go'
    must_not_match:
    - \b(FROM|INTO|UPDATE|JOIN)\s+report_opens\b
    - \bUPDATE\s+OR\s+[A-Z]+\s+report_opens\b
    - \bFROM\b[^"`;]*,\s*report_opens\b
    because: 'The keyed hash and the published-only insert live only in Record. A second writer
      could store a raw 16-byte IPv6 address, which passes the length CHECK, and put a plain
      visitor address in the database. It could also count opens of drafts. Known holes, as
      for the votes and comments rules: lower-case SQL, a table name built by concatenation,
      quoted or schema-qualified names, and views or triggers created in a .sql migration.'
    except_files:
    - internal/opens/**
    - '**/*_test.go'

  # settled by SL-015
  - name: the acceptance tests reach the program only over HTTP
    files: tests/acceptance/**/*.go
    must_not_match:
    - '(?:^|\n)[ \t]*(?:import[ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]+|\.[ \t]*)?["`]github\.com/sshubham2/hband/(?:[^i"`\r\n]|i[^n"`\r\n]|in[^t"`\r\n]|int[^e"`\r\n]|inte[^r"`\r\n]|inter[^n"`\r\n]|intern[^a"`\r\n]|interna[^l"`\r\n]|internal[^/"`\r\n]|internal/[^t"`\r\n]|internal/t[^e"`\r\n]|internal/te[^s"`\r\n]|internal/tes[^t"`\r\n]|internal/test[^u"`\r\n]|internal/testu[^t"`\r\n]|internal/testut[^i"`\r\n]|internal/testuti[^l"`\r\n]|internal/testutil[^/"`\r\n])[^"`\r\n]*["`][ \t]*(?:;[ \t]*)?(?://[^\r\n]*|/\*[^\r\n]*)?(?:\r?\n|$)'
    because: 'The slice and E-009 line 4 require acceptance tests that link none of the product
      and talk to the built ./cmd/hband over HTTP. A product import lets a test call internal
      functions in place of HTTP. The pattern matches an import spec of any package of this module
      but internal/testutil/ (grouped, single, aliased, dot or blank, either quote, a trailing comment
      or semicolon): a quoted path at the start of a line and alone on it. A build target inside a
      call is followed by a comma or a parenthesis and is not matched. Known holes, pinned quiet in internal/fitnessrules/testdata/rule_spellings.json: a one-line import block, and a path closed by '')'' on its own line (the shape of a call argument). Both are caught by construction by TestAcceptanceLinksNoneOfTheProduct in tests/acceptance/ported, which runs go list -deps -test and refuses any package of this module outside internal/testutil and tests/acceptance, and modernc.org/sqlite and golang.org/x/oauth2.'
  - name: the test helpers link none of the product
    files: internal/testutil/**/*.go
    must_not_match:
    - '(?:^|\n)[ \t]*(?:import[ \t]+)?(?:[A-Za-z_][A-Za-z0-9_]*[ \t]+|\.[ \t]*)?["`]github\.com/sshubham2/hband/(?:[^i"`\r\n]|i[^n"`\r\n]|in[^t"`\r\n]|int[^e"`\r\n]|inte[^r"`\r\n]|inter[^n"`\r\n]|intern[^a"`\r\n]|interna[^l"`\r\n]|internal[^/"`\r\n]|internal/[^t"`\r\n]|internal/t[^e"`\r\n]|internal/te[^s"`\r\n]|internal/tes[^t"`\r\n]|internal/test[^u"`\r\n]|internal/testu[^t"`\r\n]|internal/testut[^i"`\r\n]|internal/testuti[^l"`\r\n]|internal/testutil[^/"`\r\n])[^"`\r\n]*["`][ \t]*(?:;[ \t]*)?(?://[^\r\n]*|/\*[^\r\n]*)?(?:\r?\n|$)'
    because: 'program, headless, fakegithub, outside and e002row are linked into every acceptance
      package. One product import in any of them breaks E-009 line 4''s link-none check for all six
      epics at once. Today none of them imports any package of this module but internal/testutil.
      Known holes, pinned quiet in internal/fitnessrules/testdata/rule_spellings.json: a one-line import block, and a path closed by '')'' on its own line (the shape of a call argument). Both are caught by construction by TestAcceptanceLinksNoneOfTheProduct in tests/acceptance/ported, which runs go list -deps -test and refuses any package of this module outside internal/testutil and tests/acceptance, and modernc.org/sqlite and golang.org/x/oauth2.'
  - name: the DevTools driver takes its browser from Browser and reads no environment
    files: internal/testutil/headless/*.go
    must_not_match:
    - '\bos\.(?:Getenv|LookupEnv|Environ|ExpandEnv)\b'
    - '\bsyscall\.(?:Getenv|Environ)\b'
    - '\.Environ\b'
    because: 'The owner''s BROWSER RULE: CHROME_BIN, read once in headless.Browser, is the only
      source of a browser path, and Edge is never started. An environment read in Open, or in any
      other file of the package, is a second source that the Edge refusal does not guard. The
      patterns match a call or a method value. headless.go is excepted because it holds Browser,
      the one sanctioned reader of CHROME_BIN, and Shot''s HBAND_TEST_ARTIFACTS; a new read added
      there is not guarded by this rule, only by TestBrowserIsExactlyChromeBin and review. Known
      hole, pinned quiet: an alias of the os package. The Environ method of any value, an
      exec.Cmd included, is matched by the third pattern.'
    except_files:
    - internal/testutil/headless/headless.go
    - '**/*_test.go'
  - name: acceptance tests neither choose nor start a browser
    files: tests/acceptance/**/*.go
    must_not_match:
    - '\b(?:CHROME_BIN|HBAND_TEST_BROWSER)\b'
    - '["`](?:-{1,2}|/)(?:headless|remote-debugging-(?:port|pipe)|user-data-dir)\b'
    - '["`][^"`\r\n]*[ \t](?:-{1,2}|/)(?:headless|remote-debugging-(?:port|pipe)|user-data-dir)\b'
    - '(?i)\b(?:msedge|chrome|chromium)\.exe\b'
    - '(?i)\b(?:msedge|microsoft-edge|chromium-browser|google-chrome)\b'
    because: 'The BROWSER RULE says the tests must not read the environment or look for a browser
      themselves. The ledger body for E-004 line 2 hard-coded an msedge path (Q-028, #980). Naming
      CHROME_BIN here (a read, or an os.Environ scan for it), a headless, DevTools or profile flag
      with --, - or / and either quote (right after it, or after a space or tab later on the
      same line of the literal), or a browser executable name means a test bypasses
      headless.Open. Known holes, pinned quiet: a flag or a variable name built by concatenation, a
      flag after an escaped \t or at the start of a later line of a raw string, a
      browser path held in a variable, and the bare word chrome, which the verbatim E-001 and E-002
      bodies use for their User-Agent. The mapping package is excepted because its Says fields quote
      the Python verbatim. tests/acceptance/suite is excepted because its whole-suite check removes
      CHROME_BIN from, or passes it into, the environment of the go test it runs; it starts no browser
      and chooses none.'
    except_files:
    - tests/acceptance/ported/**
    - tests/acceptance/suite/**
  - name: only the acceptance packages carry an epic's acceptance key
    files: '**/*_test.go'
    must_not_match:
    - '\bfunc[ \t]+TestE00[1-6][^0-9]'
    because: 'E-009 lines 4 and 5 treat every listed TestE00[1-6] test as an acceptance test. One
      in a product package fails line 4''s outside-the-product check. One that does not build the
      program passes when the program exits at start, which line 4 also fails.'
    except_files:
    - tests/acceptance/**

  # settled by SL-017
  - name: no Python source file is committed anywhere in the repository
    files: '**/*.py'
    must_not_match:
    - \S
    because: 'The owner wants no Python in hband, and E-009 line 6 checks that only once, at the epic''s finish, so without this rule a later slice could add a .py file and pass every gate. There is no correct Python here, so any non-whitespace character in a .py file is the defect. The rule reads files on disk, not the git index, so an untracked .py fires too, and it lands in the same commit as the SL-017 deletion. Known holes, pinned as quiet corpus rows where they can be: an empty or whitespace-only .py; other Python extensions such as .pyw and .pyi, and an upper-case .PY, which the case-sensitive glob does not match; a script with no extension that starts with a shebang line naming Python; a .py holding only comments, wherever the checker does not match comments (the local Go walk reads raw text and fires on it); .pyc files, which .gitignore keeps out instead; and any .py under .taad or a testdata folder, which the local TestRulesHoldOnTheTree walk skips and only the engine Fitness check sees.'
  - name: no Go code starts a Python interpreter
    files: '**/*.go'
    must_not_match:
    - 'exec\.(?:Command|CommandContext|LookPath)\((?:[^()\r\n]|\([^()\r\n]*\))*["`](?:[^"`\r\n]*[\\/])?(?i:python[0-9.]*|pythonw|py)(?:\.(?i:exe))?["`]'
    because: 'The owner requires that nothing in the project needs Python to be built or tested. A Go test that runs a Python interpreter through os/exec makes the Go suite need Python again while every file stays .go, which the ls-files check of E-009 line 6 cannot see. The pattern fires on an os/exec Command, CommandContext or LookPath call that names a Python executable as a string literal, allowing one level of nested parentheses before it (a t.Context() argument), a folder in front, a version suffix and any letter case. It is quiet on the current tree, where every exec site names go, git or the built binary. Known holes, named and not chased: the name held in a variable or built by concatenation, a call split across lines, two or more levels of nested parentheses, a Python run line inside a longer shell string, exec.Cmd with a Path field, os.StartProcess, an aliased os/exec import, and a Python tool runner such as pytest or pip.'
  # settled by SL-019
  - name: the shared page shell knows nothing of the product
    files: internal/layout/**/*.go
    must_not_import:
    - github.com/sshubham2/hband*
    because: internal/server and internal/auth both import internal/layout, and auth holds the
      owner gate. A product import here risks an import cycle and puts server knowledge into
      the gate's 403 page. TestRulesHoldOnTheTree skips must_not_import on files that open with
      a doc comment (#931), so the engine's Fitness check is the guard of record.
  - name: no page template carries its own document shell or inline style
    files: internal/**/templates/**
    must_not_match:
    - (?i)<(!doctype|html|head|body|meta|link|style)\b
    - (?i)\sstyle\s*=
    because: A page with its own head drifts from the one stylesheet link, the title shape and
      the script gate. siteCSP's style-src 'self' silently drops a style attribute or block,
      so that element stays at the browser default with no error anywhere.
    except_files:
    - internal/layout/templates/base.html
  - name: the site never restyles the report frame's colours or scheme
    files: internal/server/static/site.css
    must_not_match:
    - '(?i)(iframe|\.report-frame)[^{}]*\{[^{}]*\b(color-scheme|filter|mix-blend-mode|opacity)\s*:'
    because: Spike report-frame-canvas-under-site-surface (V2) measured that color-scheme on
      the frame element changes the report's own prefers-color-scheme, and filter, opacity or
      blend repaint the report's pixels. Either makes site styling reach into the report, which
      the isolation constraint forbids. color-scheme on an ancestor below :root is refused by
      TestStylesheetTokens.
