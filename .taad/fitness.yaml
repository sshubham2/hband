# Architecture rules for this project: seams a design settled, in a form
# that fails. Checked on every slice by code-review and validate-slice.
#
# Add to this by hand freely -- the engine only ever APPENDS rules whose
# name it has not seen, so your comments and your edits survive.
rules:
  # settled by SL-001
  - name: no request header ever supplies scheme, host or client identity
    files: '**/*.go'
    must_not_match:
    - (?i)"(x-forwarded-[a-z-]+|x-real-ip|forwarded)"
    because: Scheme and host come only from HBAND_BASE_URL. A trusted forwarded header lets
      any client spoof the callback URL, the Secure decision or the trusted CSRF origin. C-006
      decides proxy trust deliberately when it needs the client IP.
    except_files:
    - '**/*_test.go'
  - name: no cookie is ever SameSite=Strict
    files: '**/*.go'
    must_not_match:
    - SameSiteStrictMode
    - (?i)samesite=strict
    because: The spike measured that Edge drops Strict state and session cookies on the GitHub
      Authorize-button path (a form POST answered with 303). A Strict cookie breaks sign-in
      for exactly the first-time user.
    except_files:
    - '**/*_test.go'
  - name: being the owner is never stored in the database
    files: internal/store/migrations/*.sql
    must_not_match:
    - (?i)(^|[(,])\s*"?(role|roles|is_owner|owner|is_admin|admin)"?\s+(INTEGER|INT|TEXT|BOOLEAN|BOOL|BLOB|NUMERIC|ANY)\b
    - (?i)ADD\s+COLUMN\s+"?(role|roles|is_owner|owner|is_admin|admin)"?\b
    because: The project constraint identifies the owner by the GitHub ID pinned in config.
      A stored role is a second way to reach admin, which survives a pin change and can be written
      by any SQL bug.
  - name: an /admin route is only ever registered through the one gated mount
    files: '**/*.go'
    must_not_match:
    - \.Handle(Func)?\(\s*"(?:[A-Z]+\s+)?/admin(?!/?",\s*auth\.RequireOwner\()
    because: Admin handlers must be rows of adminRoutes, mounted once as mux.Handle("/admin/",
      auth.RequireOwner(adminMux)). A pattern registered any other way escapes the access-matrix
      test, and it may escape the gate.
    except_files:
    - '**/*_test.go'
  - name: templates never bypass html/template escaping
    files: internal/**/*.go
    must_not_match:
    - template\.(HTML|HTMLAttr|JS|JSStr|URL|CSS|Srcset)\(
    - '\bimport\s+(?:\.|[A-Za-z_]\w*)\s+"html/template"'
    - '\n[ \t]+(?:\.|[A-Za-z_]\w*)[ \t]+"html/template"'
    because: Q-001 forbids passing user text through template.HTML. The epic forbids report
      bytes ever appearing in site pages. A typed conversion is how both happen silently.
    except_files:
    - '**/*_test.go'
  - name: production code never links the fake GitHub
    files: '**/*.go'
    must_not_import:
    - github.com/sshubham2/hband/internal/testutil*
    because: The fake GitHub issues a session for whatever user ID it is told. Compiled into
      the binary, it is a sign-in-as-owner backdoor.
    except_files:
    - '**/*_test.go'
    - internal/testutil/**

  # settled by SL-001
  - name: every cookie is written by the one cookie helper
    files: '**/*.go'
    must_not_match:
    - http\.Cookie\s*\{
    - http\.SetCookie\(
    - (?i)Header\(\)\.(Set|Add)\("set-cookie"
    because: A browser silently ignores a __Host- cookie (deletions included) that lacks Secure
      or Path=/, and only in production. A cookie whose SameSite is left unset also escapes
      the Strict rule. One constructor makes the attribute set a property of the code (m1).
    except_files:
    - '**/*_test.go'
    - internal/auth/cookies.go
  - name: site HTML is never rendered through text/template
    files: '**/*.go'
    must_not_import:
    - text/template
    because: text/template escapes nothing. A page rendered through it puts comment text, titles
      or report-derived strings into site HTML unescaped. The existing template.HTML rule cannot
      see an import (m5).
    except_files:
    - '**/*_test.go'
  - name: no handler derives scheme or host from the request
    files: '**/*.go'
    must_not_match:
    - \b(r|req|request)\.Host\b
    - \b(r|req|request)\.TLS\b
    - \b(r|req|request)\.URL\.(Host|Scheme)\b
    - \b(r|req|request)\.Referer\(\)
    - '(?i)Header\.(Get|Values)\(\s*["`](host|origin|referer)["`]\s*\)'
    - '(?i)Header\[\s*["`](host|origin|referer)["`]\s*\]'
    because: Scheme and host come only from HBAND_BASE_URL. Behind the VPS proxy, the Host header
      and the TLS state are whatever the client or proxy sent, so an absolute URL, Secure decision
      or trusted origin built from them can be spoofed. The existing rule only lists forwarded-header
      names (m6).
    except_files:
    - '**/*_test.go'
    - internal/testutil/**
  - name: no redirect is written through http.Redirect
    files: '**/*.go'
    must_not_match:
    - \bhttp\.Redirect\(
    - \bhttp\.RedirectHandler\(
    - '(?i)\.(Set|Add)\(\s*["`]location["`]'
    - '(?i)\[\s*["`]location["`]\s*\]'
    - \bhttp\.Status(SeeOther|Found|MovedPermanently|TemporaryRedirect|PermanentRedirect)\b
    - \.WriteHeader\(\s*(30[0-3]|30[78])\s*\)
    because: http.Redirect runs path.Clean on a validated local target. That turns `/./` plus
      a backslash and `evil.example` into a Location that browsers follow off the site, an open
      redirect right after a genuine GitHub sign-in (M-add-1). Redirects go through auth.SeeOther,
      which writes the LocalPath-checked string verbatim.
    except_files:
    - '**/*_test.go'
    - internal/testutil/**
    - internal/auth/next.go
  - name: the identity provider's endpoints are read only by the config loader
    files: '**/*.go'
    must_not_match:
    - '"HBAND_[A-Z_]*(GITHUB|OAUTH)[A-Z_]*(URL|ENDPOINT|HOST|API)[A-Z_]*"'
    because: This replaces the retired rule 'the identity provider's endpoints cannot be set
      from the environment', which contradicted the person-approved finish line. The https-or-loopback
      guard and the startup override warning live in config.Load, so a second reader of HBAND_GITHUB_URL
      or HBAND_GITHUB_API_URL would point sign-in at an unvalidated identity provider.
    except_files:
    - '**/*_test.go'
    - internal/config/config.go

  - name: site HTML is never built as a Go string literal
    files: '**/*.go'
    must_not_match:
    - '["`]\s*<[a-zA-Z!/]'
    because: Site HTML comes only from template files under templates/, which html/template escapes
      for the place each value lands. A page assembled in a Go string literal puts logins, titles
      or comment text into markup unescaped (m5).
    except_files:
    - '**/*_test.go'
    - internal/testutil/**
    - tests/**
  - name: no sign-in control is ever a form
    files: internal/**/templates/**
    must_not_match:
    - '(?i)<form\b[^>]*\baction\s*=\s*["'']?[^"''\s>]*/auth/github/login'
    - '(?i)\bformaction\s*=\s*["'']?[^"''\s>]*/auth/github/login'
    because: Every sign-in control is an anchor to /auth/github/login. A form that submits there
      has its redirect to the identity provider blocked by the site's form-action 'self' policy
      in Chromium and Safari, so sign-in fails silently in the browser and no loop test can see
      it (m3).
  # settled by SL-003
  - name: report bytes are written only by serveRaw
    files: '**/*.go'
    must_not_match:
    - \bhttp\.Serve(Content|File|FileFS)\(
    - \bhttp\.(Dir|FileServer)\(
    - \bos\.DirFS\(
    because: 'serveRaw is the one place that replaces the site CSP with rawCSP (sandbox, script-src
      ''none'', frame-ancestors) and sets nosniff and CORP. A second ServeContent or ServeFile
      writes report bytes under the site policy: script-src ''self'', no sandbox, and the site''s
      own origin. Opened top-level, that page is unsandboxed same-origin HTML. A file server
      over a directory (http.FileServer(http.Dir(...)), http.FileServerFS(os.DirFS(...))) is
      the likeliest accidental way to do the same to <data>/reports. The static assets are served
      from the embedded filesystem, which none of these names.'
    except_files:
    - internal/server/raw.go
    - '**/*_test.go'
    - internal/testutil/**
  - name: no site template frames a report with scripts or the site origin, or inlines it
    files: internal/**
    must_not_match:
    - (?i)\bsrcdoc\s*=
    - (?i)\bsandbox\s*=\s*["']?[^"'>]*\ballow-(scripts|same-origin|top-navigation|forms)
    because: The project constraint requires the report iframe to be sandboxed without allow-scripts.
      Isolation is path-based on the site origin, so allow-same-origin hands the report the
      site's cookies and parent DOM, and allow-top-navigation or allow-forms lets it drive the
      reader's page. srcdoc puts report bytes inside a site page, which the constraint forbids.
      The glob covers every non-Go file under internal/ (templates and the embedded static
      files that are served under the site policy alike); Go files hold the report policy
      itself, which the HTTP tests pin.
    except_files:
    - '**/*.go'
    - '**/testdata/**'
  - name: only the audited templates contain a frame element
    files: internal/**
    must_not_match:
    - (?i)<(iframe|frame|fencedframe|object|embed)\b
    because: A frame, object or embed that loads a report without a sandbox attribute leaves only
      the report policy header between a reader and the report's scripts, and a regular expression
      cannot say 'an iframe lacking a sandbox attribute'. So the element is forbidden outside the
      two templates whose iframes are pinned by the HTTP tests (the reader page and the owner's
      preview). A page placed under static/ is served under the site policy, whose frame-src
      'self' allows framing /raw/<slug>, so the glob covers it too.
    except_files:
    - '**/*.go'
    - '**/testdata/**'
    - internal/server/templates/report.html
    - internal/server/templates/admin_report.html
  - name: only raw.go and admin.go open report files
    files: '**/*.go'
    must_not_match:
    - \.OpenRaw\b
    because: OpenRaw hands back the open file of a report, drafts included when its last argument
      is false. The token is forbidden outside the two handlers that are pinned by tests (the
      public one, whose publishedOnly argument TestHiddenReportsAreIndistinguishable pins, and
      the owner's preview), so a multi-line call, a method value or a flag held in a variable
      cannot slip past a pattern that tried to read the argument.
    except_files:
    - internal/server/raw.go
    - internal/server/admin.go
    - internal/reports/**
    - '**/*_test.go'
  - name: only the gated admin reaches drafts
    files: '**/*.go'
    must_not_match:
    - \.BySlug\b
    - \.ListAll\b
    because: BySlug and ListAll return drafts. A public handler that calls one serves an unpublished
      report or reveals that it exists, which defeats the identical 404s for draft, unpublished,
      deleted and unknown slugs. Only the owner-gated admin may see drafts. The token form
      also catches a method value and a call split over lines.
    except_files:
    - internal/server/admin.go
    - internal/reports/**
    - '**/*_test.go'

  # settled by SL-004
  - name: only the owner's admin page reads the dislike tally
    files: '**/*.go'
    must_not_match:
    - \.\s*OwnerTally\b
    because: 'OwnerTally is the only producer of a dislike count. A reader handler, template
      helper or new endpoint that calls it (or takes its method value) serves dislikes to readers,
      which the project''s privacy constraint forbids. Known hole: a dislike field added to
      PublicView inside internal/votes. TestDislikesDoNotInterfere catches that; this rule does
      not.'
    except_files:
    - internal/server/admin.go
    - internal/votes/**
    - '**/*_test.go'
  - name: only internal/votes writes SQL on the votes table
    files: '**/*.go'
    must_not_match:
    - \b(FROM|INTO|UPDATE|JOIN)\s+votes\b
    - \bUPDATE\s+OR\s+[A-Z]+\s+votes\b
    - '\bFROM\b[^"`;]*,\s*votes\b'
    because: 'A second reader of the table can count kind=''down'' and bypass both the OwnerTally
      fence and the PublicView type. A second writer bypasses Cast''s published-only check and
      its single-statement discipline. Known holes (CC-001): lower-case SQL; a table name built
      by concatenation; a quoted or schema-qualified name (FROM "votes", FROM main.votes); a
      comma join whose FROM sits in another string literal than the table name; and a view or
      trigger over votes created by a later .sql migration, which no Go-file glob can see.'
    except_files:
    - internal/votes/**
    - '**/*_test.go'
  - name: vote writes never open a transaction
    files: internal/votes/**/*.go
    must_not_match:
    - \.Begin(Tx)?\(
    - (?i)\b(BEGIN|SAVEPOINT)\b
    - \bsql\.Tx\b
    because: Spike concurrent-vote-upserts-no-busy measured a read-then-write transaction failing
      215-253 times per run with SQLITE_BUSY/BUSY_SNAPSHOT, returned at once without waiting
      on busy_timeout, and losing votes. Single statements had 0 errors under the same load.
      SAVEPOINT starts the same deferred transaction in autocommit mode, so it is named beside
      BEGIN. Known holes (CC-001) - a transaction opened OUTSIDE this package and handed in
      through an interface other than sql.Tx (for example a DBTX interface the caller satisfies
      with a transaction), a statement spelled by concatenation, and a Go identifier that
      merely contains the keyword.
    except_files:
    - '**/*_test.go'
